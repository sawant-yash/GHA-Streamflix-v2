name: Switch Traffic (BLUE ↔ GREEN)

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Version to route traffic to (v1 or v2)"
        required: true
        default: "v1"

jobs:
  switch:
    runs-on: self-hosted

    steps:
    - name: Switch traffic
      run: |
        echo "Switching traffic to version: ${{ github.event.inputs.target_version }}"
        kubectl patch service streamflix-service \
          -p "{\"spec\":{\"selector\":{\"app\":\"streamflix\",\"version\":\"${{ github.event.inputs.target_version }}\"}}}"

    - name: Verify service selector
      run: |
        kubectl get svc streamflix-service -o yaml | grep version
